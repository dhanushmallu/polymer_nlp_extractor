# Docker Compose for Infrastructure Services Only
# 
# Purpose: Orchestrates essential backend services for Polymer NLP Extractor
# - PostgreSQL: Primary database for metadata, user data, extraction results
# - Neo4j: Knowledge graph database for entity relationships and validation  
# - GROBID: Document processing service for PDF to XML conversion
# - pgAdmin: Optional database administration interface
#
# Usage: docker compose -f docker-compose.services.yml up -d
# Management: Use ./server.sh for service lifecycle management
#
# Service Architecture:
# - All services run in isolated containers with dedicated volumes
# - Services communicate via polymer_network bridge network
# - Health checks ensure services are ready before application startup
# - Persistent volumes preserve data across container restarts
#
# Port Mapping (configurable via .env):
# - PostgreSQL: 5432 (POSTGRES_PORT)
# - Neo4j Bolt: 7687 (NEO4J_PORT)  
# - Neo4j HTTP: 7474 (NEO4J_HTTP_PORT)
# - GROBID: 8070 (GROBID_PORT)
# - pgAdmin: 5050 (PGADMIN_PORT)
#
# Data Persistence:
# - postgres_data: PostgreSQL database files
# - neo4j_data: Neo4j graph database  
# - neo4j_logs: Neo4j operation logs
# - neo4j_conf: Neo4j configuration files
# - pgadmin_data: pgAdmin user preferences and connections
#
# Security Notes:
# - Database credentials loaded from .env file
# - Neo4j runs with host UID/GID to prevent permission issues
# - Services isolated within dedicated network
# - pgAdmin profile prevents accidental exposure in production

services:
  # PostgreSQL Database - Primary relational database for application metadata
  # Stores: extraction metadata, dataset information, user sessions, system logs
  # Configuration: UTF-8 encoding with C locale for consistent text handling
  postgres:
    image: postgres:15-alpine
    container_name: polymer_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data          # Persistent database storage
      - ./db/sql:/docker-entrypoint-initdb.d            # Initialization SQL scripts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - polymer_network

  # Neo4j Graph Database - Knowledge graph for entity relationships and validation
  # Stores: polymer-property relationships, canonical entity mappings, validation rules
  # Features: APOC plugins enabled for advanced graph operations
  neo4j:
    image: neo4j:5.15-community
    container_name: polymer_neo4j
    restart: unless-stopped
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"  # Run as host user to prevent ownership issues
    environment:
      NEO4J_AUTH: "${NEO4J_USER}/${NEO4J_PASSWORD}"
      NEO4J_PLUGINS: '["apoc"]'                       # Advanced procedures and functions
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
      NEO4J_dbms_connector_https_advertised__address: localhost:7473
      NEO4J_dbms_connector_http_advertised__address: localhost:7474
      NEO4J_dbms_connector_bolt_advertised__address: localhost:7687
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"   # HTTP browser interface
      - "${NEO4J_HTTPS_PORT:-7473}:7473"  # HTTPS (optional)
      - "${NEO4J_PORT:-7687}:7687"        # Bolt protocol for drivers
    volumes:
      - neo4j_data:/data                              # Graph database storage
      - neo4j_logs:/logs                              # Operation and query logs  
      - neo4j_conf:/conf                              # Configuration files
      - ./kg/cypher:/var/lib/neo4j/import             # Cypher scripts for initialization
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER}", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - polymer_network

  # GROBID Document Processing Service - PDF to XML conversion
  # Processes: Scientific PDFs to structured XML using machine learning models
  # Features: Bibliographic extraction, full-text structure recognition, citation parsing
  grobid:
    image: lfoppiano/grobid:0.8.2
    container_name: polymer_grobid
    restart: unless-stopped
    ports:
      - "${GROBID_PORT:-8070}:8070"
    environment:
      JAVA_OPTS: "-Xmx4g"                           # 4GB heap for processing large documents
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8070/api/isalive"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - polymer_network

  # pgAdmin - Optional PostgreSQL administration interface  
  # Features: Query editor, database visualization, performance monitoring
  # Access: Web interface for database management and debugging
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: polymer_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'           # Desktop mode for simplified usage
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin               # User settings and server connections
    depends_on:
      - postgres
    networks:
      - polymer_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 5
    profiles:
      - admin  # Only start with: docker-compose --profile admin up

volumes:
  # Persistent storage volumes for service data retention across container restarts
  postgres_data:
    driver: local                                   # PostgreSQL database files and WAL logs
  neo4j_data:
    driver: local                                   # Neo4j graph database storage
  neo4j_logs:
    driver: local                                   # Neo4j operation and query logs
  neo4j_conf:
    driver: local                                   # Neo4j configuration and plugins
  pgadmin_data:
    driver: local                                   # pgAdmin user settings and connections

networks:
  # Isolated network for service communication and security
  polymer_network:
    driver: bridge                                  # Standard bridge network for container isolation
    name: polymer_network                           # Explicit naming for external reference
